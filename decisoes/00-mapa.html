<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa</title>
<link rel="stylesheet" href="../site.css">
</head>
<body>
<header><a href="../index.html" target="_blank" rel="noopener">Flechas de goblin</a></header>
<main>
<h1>Mapa</h1>
<p>A leitura não para aqui. Só abres um destes arquivos quando a cena o disser.</p>
<table><thead><tr><th>Quando</th><th>Arquivo</th></tr></thead><tbody><tr><td>Depois da emboscada</td><td><a href="01-perseguir-ou-abandonar.html" target="_blank" rel="noopener">Perseguir ou seguir</a></td></tr><tr><td>Diante da boca</td><td><a href="../historia-principal/04-area-1-boca.html" target="_blank" rel="noopener">Área 1</a></td></tr><tr><td>O poste, se o relógio chegou a zero</td><td><a href="03-relogio-viva-ou-morta.html" target="_blank" rel="noopener">Viva ou morta</a></td></tr><tr><td>Yeemik oferece a cabeça de Klarg</td><td><a href="04-trato-yeemik.html" target="_blank" rel="noopener">O trato</a></td></tr><tr><td>Foram a Phandalin sem ela</td><td><a href="05-prisao-phandalin.html" target="_blank" rel="noopener">A praça</a></td></tr></tbody></table>
</main>
<script>
const relogio = document.querySelector("[data-relogio]");
if (relogio) {
  const marcas = [...relogio.querySelectorAll(".marca")];
  const restam = relogio.querySelector("[data-restam]");
  const chave = "fandelver-relogio";
  const guardadas = JSON.parse(localStorage.getItem(chave) || "[]");
  marcas.forEach((marca, i) => { if (guardadas[i]) marca.classList.add("gasta"); });
  const pintar = () => {
    restam.textContent = String(marcas.filter((marca) => !marca.classList.contains("gasta")).length);
    localStorage.setItem(chave, JSON.stringify(marcas.map((marca) => marca.classList.contains("gasta"))));
  };
  pintar();
  relogio.addEventListener("click", (e) => {
    const marca = e.target.closest(".marca");
    if (!marca) return;
    e.stopPropagation();
    marca.classList.toggle("gasta");
    pintar();
  });
}
const golpe = document.querySelector("[data-golpe]");
if (golpe) {
  let player = null;
  let ready = false;
  let playing = false;
  let jumped = false;
  let timer = 0;
  let fim = 0;
  const stop = () => {
    playing = false;
    clearInterval(timer);
    clearTimeout(fim);
    golpe.textContent = "Golpe";
    if (ready) {
      player.pauseVideo();
      player.seekTo(0, true);
    }
  };
  const play = () => {
    clearInterval(timer);
    jumped = false;
    player.seekTo(0, true);
    player.playVideo();
    playing = true;
    golpe.textContent = "Cortar";
    timer = setInterval(() => {
      const t = player.getCurrentTime();
      if (!jumped && t >= 15) {
        jumped = true;
        player.seekTo(70, true);
        fim = setTimeout(() => { if (playing) stop(); }, 12000);
      } else if (jumped && t >= 80) stop();
    }, 200);
  };
  const boot = () => {
    player = new YT.Player("golpe-yt", {
      videoId: "4Nvzmkg-CGw",
      width: "200",
      height: "113",
      playerVars: { origin: location.origin, rel: 0, modestbranding: 1, playsinline: 1 },
      events: { onReady() { ready = true; golpe.disabled = false; } }
    });
  };
  golpe.addEventListener("click", () => {
    if (!ready) return;
    if (playing) stop();
    else play();
  });
  window.onYouTubeIframeAPIReady = boot;
  const tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);
}
</script>
</body>
</html>
